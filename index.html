<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rectangle DXF Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E9E7DF;
    --paper-deep:#DEDBD0;
    --line:#B9B5A6;
    --line-strong:#22251F;
    --ink:#22251F;
    --ink-soft:#6E6B5E;
    --ms-bg:#000000;
    --ms-grid:rgba(125,145,155,.10);
    --ms-grid-major:rgba(125,145,155,.22);
    --ms-axis:rgba(150,168,178,.45);
    --cyan:#43D6CF;
    --cyan-fill:rgba(67,214,207,.10);
    --yellow:#E3C15C;
    --red:#E05A4E;
    --green:#59B96E;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --disp:'Archivo',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper-deep);
    font-family:var(--disp);
    color:var(--ink);
    display:flex;justify-content:center;
    padding:12px;
    height:100dvh;overflow:hidden;
  }
  .sheet{
    width:100%;max-width:1256px;height:100%;
    background:var(--paper);
    border:1.5px solid var(--line-strong);
    display:flex;flex-direction:column;
    box-shadow:0 2px 0 rgba(0,0,0,.12), 0 14px 34px rgba(0,0,0,.16);
  }
  /* ---------- sheet header ---------- */
  .sheet-head{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;padding:13px 18px 11px;
    border-bottom:1.5px solid var(--line-strong);
    flex:0 0 auto;
  }
  .sheet-head h1{
    font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  }
  .sheet-head .dwg{
    font-family:var(--mono);font-size:10px;color:var(--ink-soft);letter-spacing:.06em;
  }
  /* ---------- main grid ---------- */
  .body-grid{
    display:grid;grid-template-columns:288px 1fr;
    flex:1 1 auto;min-height:0;
  }
  @media (max-width:720px){
    .body-grid{grid-template-columns:1fr}
    body{padding:8px 6px;height:auto;overflow:auto}
    .sheet{height:auto}
  }
  /* ---------- parameter panel ---------- */
  .panel{
    border-right:1.5px solid var(--line-strong);
    display:flex;flex-direction:column;
    min-height:0;overflow-y:auto;
  }
  @media (max-width:720px){
    .panel{border-right:none;border-bottom:1.5px solid var(--line-strong);overflow:visible}
  }
  .panel .group{padding:14px 16px;border-bottom:1px solid var(--line)}
  .panel .group:last-child{border-bottom:none}
  .eyebrow{
    font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:10px;
  }
  .field{
    display:grid;grid-template-columns:1fr 110px;align-items:center;
    gap:8px;margin-bottom:7px;
  }
  .field:last-child{margin-bottom:0}
  .field label{font-size:12px;font-weight:500}
  .field label small{display:block;font-size:10px;font-weight:400;color:var(--ink-soft)}
  .field input{
    font-family:var(--mono);font-size:13px;text-align:right;
    padding:6px 9px;border:1px solid var(--line);border-radius:0;
    background:#fff;color:var(--ink);width:100%;
  }
  .field input:focus{outline:2px solid var(--cyan);outline-offset:-1px;border-color:var(--cyan)}
  .field input.bad{border-color:var(--red);outline-color:var(--red)}
  /* presets */
  .preset-row{display:flex;gap:6px;margin-bottom:6px}
  .preset-row select,.preset-row input{
    flex:1;font-family:var(--mono);font-size:12px;padding:5px 8px;
    border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:0;min-width:0;
  }
  .preset-row select:focus,.preset-row input:focus{outline:2px solid var(--cyan);outline-offset:-1px}
  .btn-row{display:flex;gap:6px}
  .btn{
    font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;padding:6px 0;flex:1;cursor:pointer;
    background:var(--paper);border:1px solid var(--line-strong);color:var(--ink);border-radius:0;
  }
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
  .note{font-size:10px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
  .hint{font-size:10px;color:var(--ink-soft);line-height:1.5}
  /* ---------- viewport ---------- */
  .viewport-wrap{display:flex;flex-direction:column;background:var(--ms-bg);min-height:0}
  .viewport{
    position:relative;flex:1;min-height:220px;cursor:crosshair;touch-action:none;
  }
  @media (max-width:720px){
    .viewport{min-height:300px}
  }
  .viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .statusbar{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-family:var(--mono);font-size:11px;letter-spacing:.03em;
    color:#8fa3ad;background:#000;
    padding:6px 12px;border-top:1px solid #15181C;
  }
  .statusbar .coords{color:var(--cyan)}
  /* ---------- title block ---------- */
  .titleblock{
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr 1fr auto;
    border-top:1.5px solid var(--line-strong);
    flex:0 0 auto;
  }
  .tb-cell{
    padding:8px 12px;border-right:1px solid var(--line);
    display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;
  }
  .tb-cell .k{font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  .tb-cell .v{font-family:var(--mono);font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-generate{
    border-right:none;padding:0;
  }
  #generate{
    height:100%;width:100%;min-height:52px;
    font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    background:var(--ink);color:var(--paper);border:none;cursor:pointer;padding:0 26px;border-radius:0;
  }
  #generate:hover:not(:disabled){background:#000}
  #generate:disabled{background:var(--line);color:var(--paper);cursor:not-allowed}
  #generate:focus-visible{outline:2px solid var(--cyan);outline-offset:-3px}
  @media (max-width:720px){
    .titleblock{grid-template-columns:1fr 1fr}
    .tb-generate{grid-column:1/-1}
    #generate{min-height:48px;padding:14px 0}
  }
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:12px;padding:9px 16px;
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="sheet">

  <div class="sheet-head">
    <h1>Rectangle DXF Generator</h1>
    <span class="dwg">DWG NO. RECT-001 &middot; MODEL SPACE</span>
  </div>

  <div class="body-grid">
    <!-- ============ parameters ============ -->
    <div class="panel">
      <div class="group">
        <div class="eyebrow">Geometry</div>
        <div class="field">
          <label for="in-x">X <small>origin X</small></label>
          <input id="in-x" type="text" inputmode="decimal" value="0">
        </div>
        <div class="field">
          <label for="in-y">Y <small>origin Y</small></label>
          <input id="in-y" type="text" inputmode="decimal" value="0">
        </div>
        <div class="field">
          <label for="in-dx">dX <small>width</small></label>
          <input id="in-dx" type="text" inputmode="decimal" value="100">
        </div>
        <div class="field">
          <label for="in-dy">dY <small>height</small></label>
          <input id="in-dy" type="text" inputmode="decimal" value="50">
        </div>
        <div class="field">
          <label for="in-z">dZ <small>elevation</small></label>
          <input id="in-z" type="text" inputmode="decimal" value="0">
        </div>
      </div>

      <div class="group">
        <div class="eyebrow">Presets</div>
        <div class="preset-row">
          <select id="preset-select" aria-label="Saved presets">
            <option value="">— saved presets —</option>
          </select>
        </div>
        <div class="preset-row">
          <input id="preset-name" type="text" placeholder="preset name" aria-label="Preset name">
        </div>
        <div class="btn-row">
          <button class="btn" id="preset-save">Save</button>
          <button class="btn" id="preset-load">Load</button>
          <button class="btn" id="preset-delete">Delete</button>
        </div>
        <div class="note" id="preset-note"></div>
      </div>

      <div class="group">
        <div class="hint">Scroll to zoom &middot; drag to pan &middot; double-click to reset view.</div>
      </div>
    </div>

    <!-- ============ viewport ============ -->
    <div class="viewport-wrap">
      <div class="viewport" id="viewport">
        <canvas id="cv"></canvas>
      </div>
      <div class="statusbar">
        <span class="coords" id="sb-coords">&mdash;</span>
        <span id="sb-zoom">ZOOM 1.0&times;</span>
      </div>
    </div>
  </div>

  <!-- ============ title block ============ -->
  <div class="titleblock">
    <div class="tb-cell"><span class="k">Title</span><span class="v">RECTANGLE, CLOSED POLYLINE</span></div>
    <div class="tb-cell"><span class="k">Size</span><span class="v" id="tb-size">100 &times; 50</span></div>
    <div class="tb-cell"><span class="k">Elevation</span><span class="v" id="tb-elev">0</span></div>
    <div class="tb-cell"><span class="k">Date</span><span class="v" id="tb-date"></span></div>
    <div class="tb-cell tb-generate">
      <button id="generate">Generate DXF</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  "use strict";

  /* ---------------- state ---------------- */
  const MARGIN = 34;
  const view = { scale: 1, panX: 0, panY: 0 };
  const inputs = {
    x:  document.getElementById("in-x"),
    y:  document.getElementById("in-y"),
    dx: document.getElementById("in-dx"),
    dy: document.getElementById("in-dy"),
    z:  document.getElementById("in-z"),
  };
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const viewport = document.getElementById("viewport");
  const sbCoords = document.getElementById("sb-coords");
  const sbZoom = document.getElementById("sb-zoom");
  let W = 0, H = 0, DPR = 1;
  let mouse = null; // {px, py} in CSS pixels, or null when outside

  function num(el){
    const v = parseFloat(el.value);
    return Number.isFinite(v) ? v : null;
  }
  function getValues(){
    const x = num(inputs.x), y = num(inputs.y), dx = num(inputs.dx),
          dy = num(inputs.dy), z = num(inputs.z);
    inputs.x.classList.toggle("bad", x === null);
    inputs.y.classList.toggle("bad", y === null);
    inputs.dx.classList.toggle("bad", dx === null || dx <= 0);
    inputs.dy.classList.toggle("bad", dy === null || dy <= 0);
    inputs.z.classList.toggle("bad", z === null);
    if (x===null||y===null||dx===null||dy===null||z===null||dx<=0||dy<=0) return null;
    return { x, y, dx, dy, z };
  }

  /* ---------------- fit & transforms ---------------- */
  function computeFit(v){
    const minX = Math.min(0, v.x), maxX = Math.max(0, v.x + v.dx);
    const minY = Math.min(0, v.y), maxY = Math.max(0, v.y + v.dy);
    const ww = Math.max(maxX - minX, 1e-3) * 1.15;
    const wh = Math.max(maxY - minY, 1e-3) * 1.15;
    const scale = Math.min((W - 2*MARGIN) / ww, (H - 2*MARGIN) / wh);
    return { scale, cx: (minX + maxX)/2, cy: (minY + maxY)/2 };
  }
  function transforms(v){
    const fit = computeFit(v);
    const s = fit.scale * view.scale;
    const ox = W/2 - fit.cx * s + view.panX;
    const oy = H/2 + fit.cy * s + view.panY;
    return {
      s,
      toPx: (wx, wy) => [ox + wx*s, oy - wy*s],
      toWorld: (px, py) => [(px - ox)/s, (oy - py)/s],
    };
  }

  /* ---------------- drawing ---------------- */
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function draw(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const v = getValues();

    if (!v){
      ctx.fillStyle = "#5a6a74";
      ctx.font = "12px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("Enter valid values to preview (dX, dY > 0)", W/2, H/2);
      sbCoords.textContent = "\u2014";
      updateTitleBlock(null);
      return;
    }

    const t = transforms(v);

    /* axes */
    const [axPx, axPy] = t.toPx(0, 0);
    ctx.strokeStyle = css("--ms-axis");
    ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(axPx, 0); ctx.lineTo(axPx, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, axPy); ctx.lineTo(W, axPy); ctx.stroke();
    ctx.setLineDash([]);

    /* rectangle */
    const [rx0, ry0] = t.toPx(v.x, v.y + v.dy);       // top-left px
    const [rx1, ry1] = t.toPx(v.x + v.dx, v.y);       // bottom-right px
    ctx.fillStyle = css("--cyan-fill");
    ctx.fillRect(rx0, ry0, rx1-rx0, ry1-ry0);
    ctx.strokeStyle = css("--cyan");
    ctx.lineWidth = 1.6;
    ctx.strokeRect(rx0, ry0, rx1-rx0, ry1-ry0);

    /* dimension lines */
    ctx.strokeStyle = css("--yellow");
    ctx.fillStyle = css("--yellow");
    ctx.lineWidth = 1;
    ctx.font = "11px 'IBM Plex Mono', monospace";
    // dX below
    const dimY = ry1 + 18;
    dimLine(rx0, dimY, rx1, dimY);
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText(fmt(v.dx), (rx0+rx1)/2, dimY - 4);
    // dY left
    const dimX = rx0 - 18;
    dimLine(dimX, ry0, dimX, ry1, true);
    ctx.save();
    ctx.translate(dimX - 4, (ry0+ry1)/2); ctx.rotate(-Math.PI/2);
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText(fmt(v.dy), 0, 0);
    ctx.restore();

    /* origin UCS icon */
    ucs(axPx, axPy);

    /* base point */
    const [bx, by] = t.toPx(v.x, v.y);
    ctx.strokeStyle = css("--red");
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(bx-6, by); ctx.lineTo(bx+6, by);
    ctx.moveTo(bx, by-6); ctx.lineTo(bx, by+6);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(bx, by, 3.4, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = css("--red");
    ctx.font = "10px 'IBM Plex Mono', monospace";
    ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText("(" + fmt(v.x) + ", " + fmt(v.y) + ")", bx + 9, by - 6);

    /* crosshair */
    if (mouse){
      ctx.strokeStyle = "rgba(150,168,178,.35)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(mouse.px, 0); ctx.lineTo(mouse.px, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, mouse.py); ctx.lineTo(W, mouse.py); ctx.stroke();
      const [mwx, mwy] = t.toWorld(mouse.px, mouse.py);
      sbCoords.textContent = fmt2(mwx) + ", " + fmt2(mwy) + ", " + fmt2(v.z);
    } else {
      sbCoords.textContent = "\u2014";
    }
    sbZoom.textContent = "ZOOM " + view.scale.toFixed(1) + "\u00D7";

    updateTitleBlock(v);

    function dimLine(x0, y0, x1, y1, vert){
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      tick(x0, y0, vert); tick(x1, y1, vert);
    }
    function tick(x, y, vert){
      ctx.beginPath();
      if (vert){ ctx.moveTo(x-4, y+4); ctx.lineTo(x+4, y-4); }
      else     { ctx.moveTo(x-4, y+4); ctx.lineTo(x+4, y-4); }
      ctx.stroke();
    }
    function ucs(x, y){
      const L = 26;
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = css("--red");
      arrow(x, y, x+L, y);
      ctx.strokeStyle = css("--green");
      arrow(x, y, x, y-L);
      ctx.font = "9px 'IBM Plex Mono', monospace";
      ctx.fillStyle = css("--red");
      ctx.textAlign="left"; ctx.textBaseline="middle";
      ctx.fillText("X", x+L+4, y);
      ctx.fillStyle = css("--green");
      ctx.textAlign="center"; ctx.textBaseline="bottom";
      ctx.fillText("Y", x, y-L-3);
    }
    function arrow(x0,y0,x1,y1){
      const a = Math.atan2(y1-y0, x1-x0);
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1-7*Math.cos(a-.4), y1-7*Math.sin(a-.4));
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1-7*Math.cos(a+.4), y1-7*Math.sin(a+.4));
      ctx.stroke();
    }
  }

  function fmt(n){
    return Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : String(+n.toFixed(4));
  }
  function fmt2(n){ return n.toFixed(2); }

  function updateTitleBlock(v){
    document.getElementById("tb-size").textContent = v ? fmt(v.dx) + " \u00D7 " + fmt(v.dy) : "\u2014";
    document.getElementById("tb-elev").textContent = v ? fmt(v.z) : "\u2014";
    document.getElementById("generate").disabled = !v;
  }

  /* ---------------- view interaction ---------------- */
  function resetView(){
    view.scale = 1; view.panX = 0; view.panY = 0;
    draw();
  }

  viewport.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const ex = e.clientX - rect.left, ey = e.clientY - rect.top;
    let factor = e.deltaY < 0 ? 1.1 : 1/1.1;
    const newScale = Math.max(0.1, Math.min(view.scale * factor, 50));
    factor = newScale / view.scale;
    if (factor === 1) return;
    view.panX = ex - W/2 - factor * (ex - W/2 - view.panX);
    view.panY = ey - H/2 - factor * (ey - H/2 - view.panY);
    view.scale = newScale;
    draw();
  }, { passive:false });

  let dragging = false, lastX = 0, lastY = 0, movedPx = 0;
  viewport.addEventListener("pointerdown", e => {
    dragging = true; movedPx = 0;
    lastX = e.clientX; lastY = e.clientY;
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener("pointermove", e => {
    const rect = viewport.getBoundingClientRect();
    mouse = { px: e.clientX - rect.left, py: e.clientY - rect.top };
    if (dragging){
      view.panX += e.clientX - lastX;
      view.panY += e.clientY - lastY;
      movedPx += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
      lastX = e.clientX; lastY = e.clientY;
    }
    draw();
  });
  viewport.addEventListener("pointerup", () => { dragging = false; });
  viewport.addEventListener("pointerleave", () => { dragging = false; mouse = null; draw(); });
  viewport.addEventListener("dblclick", resetView);

  /* ---------------- inputs ---------------- */
  Object.values(inputs).forEach(el => el.addEventListener("input", draw));

  /* ---------------- presets ---------------- */
  const PRESET_KEY = "rect_dxf_presets";
  let presets = {};        // name -> {x,y,dx,dy,z}
  let backend = "memory";  // "artifact" | "local" | "memory"
  const presetSelect = document.getElementById("preset-select");
  const presetName = document.getElementById("preset-name");
  const presetNote = document.getElementById("preset-note");

  async function loadPresets(){
    // 1) Artifact storage (claude.ai preview)
    if (window.storage){
      try{
        const r = await window.storage.get(PRESET_KEY);
        presets = r && r.value ? JSON.parse(r.value) : {};
        backend = "artifact";
      }catch(err){
        presets = {};
        backend = "artifact"; // key just doesn't exist yet
      }
    } else {
      // 2) Browser localStorage (file opened locally / self-hosted)
      try{
        const raw = localStorage.getItem(PRESET_KEY);
        presets = raw ? JSON.parse(raw) : {};
        backend = "local";
      }catch(err){
        // 3) In-memory only (storage blocked or unavailable)
        presets = {};
        backend = "memory";
        presetNote.textContent = "Presets are kept for this session only in this environment.";
      }
    }
    refreshPresetDropdown();
  }
  async function persistPresets(){
    try{
      if (backend === "artifact"){
        await window.storage.set(PRESET_KEY, JSON.stringify(presets));
      } else if (backend === "local"){
        localStorage.setItem(PRESET_KEY, JSON.stringify(presets));
      }
    }catch(err){ toast("Could not save presets"); }
  }
  function refreshPresetDropdown(select){
    const names = Object.keys(presets).sort();
    presetSelect.innerHTML = "";
    const ph = document.createElement("option");
    ph.value = ""; ph.textContent = names.length ? "\u2014 saved presets \u2014" : "\u2014 no presets yet \u2014";
    presetSelect.appendChild(ph);
    names.forEach(n => {
      const o = document.createElement("option");
      o.value = n; o.textContent = n;
      presetSelect.appendChild(o);
    });
    if (select && names.includes(select)) presetSelect.value = select;
  }

  document.getElementById("preset-save").addEventListener("click", async () => {
    const name = presetName.value.trim();
    if (!name){ toast("Enter a name for this preset"); return; }
    const v = getValues();
    if (!v){ toast("Fix the highlighted values first"); return; }
    if (presets[name] && !confirm('Overwrite preset "' + name + '"?')) return;
    presets[name] = v;
    await persistPresets();
    refreshPresetDropdown(name);
    toast('Saved "' + name + '"');
  });
  document.getElementById("preset-load").addEventListener("click", () => {
    const name = presetSelect.value;
    if (!name || !presets[name]){ toast("Choose a saved preset first"); return; }
    const p = presets[name];
    inputs.x.value  = p.x  ?? 0;
    inputs.y.value  = p.y  ?? 0;
    inputs.dx.value = p.dx ?? 100;
    inputs.dy.value = p.dy ?? 50;
    inputs.z.value  = p.z  ?? 0;
    presetName.value = name;
    draw();
  });
  document.getElementById("preset-delete").addEventListener("click", async () => {
    const name = presetSelect.value;
    if (!name || !presets[name]){ toast("Choose a saved preset first"); return; }
    if (!confirm('Delete preset "' + name + '"?')) return;
    delete presets[name];
    await persistPresets();
    refreshPresetDropdown();
    toast('Deleted "' + name + '"');
  });

  /* ---------------- DXF generation ---------------- */
  function buildDxf(v){
    // Minimal R12-style DXF: closed 3D polyline, four vertices.
    // Entities-only files are the most widely accepted hand-written DXFs.
    const pts = [
      [v.x,        v.y,        v.z],
      [v.x + v.dx, v.y,        v.z],
      [v.x + v.dx, v.y + v.dy, v.z],
      [v.x,        v.y + v.dy, v.z],
    ];
    const L = ["0","SECTION","2","ENTITIES",
               "0","POLYLINE","8","0","66","1","70","9"];
    for (const [px, py, pz] of pts){
      L.push("0","VERTEX","8","0","70","32",
             "10",String(px),"20",String(py),"30",String(pz));
    }
    L.push("0","SEQEND","0","ENDSEC","0","EOF");
    return L.join("\r\n") + "\r\n";
  }

  document.getElementById("generate").addEventListener("click", () => {
    const v = getValues();
    if (!v){ toast("Fix the highlighted values first"); return; }
    const blob = new Blob([buildDxf(v)], { type: "application/dxf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "rectangle.dxf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("rectangle.dxf downloaded");
  });

  /* ---------------- misc ---------------- */
  const toastEl = document.getElementById("toast");
  let toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  document.getElementById("tb-date").textContent =
    new Date().toISOString().slice(0, 10);

  function resize(){
    const rect = viewport.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    W = rect.width; H = rect.height;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    draw();
  }
  new ResizeObserver(resize).observe(viewport);
  window.addEventListener("resize", resize);

  loadPresets().then(draw);
  resize();
})();
</script>
</body>
